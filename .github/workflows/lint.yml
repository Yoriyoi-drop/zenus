name: Zenus OS Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Code Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-05-01
          profile: minimal
          components: rustfmt

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust Formatting
        run: |
          cargo fmt --all -- --check
          echo "✅ Code formatting is correct"

  clippy:
    name: Clippy Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-05-01
          profile: minimal
          components: clippy

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: |
          # `--all-targets` includes test targets, which need a host triple:
          # x86_64-unknown-none has no `std`, so the harness cannot link there.
          cargo clippy --all-targets --all-features --target x86_64-unknown-linux-gnu -- -D warnings
          echo "✅ Clippy checks passed (host)"

      - name: Clippy (kernel target)
        run: |
          # The kernel crates are no_std and must also be linted for the real
          # target; `--lib` keeps the un-linkable test harness out of it.
          cargo clippy --workspace --lib --target x86_64-unknown-none -- -D warnings
          echo "✅ Clippy checks passed (kernel)"

  rustdoc:
    name: Rust Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-05-01
          profile: minimal
          components: rustc

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Documentation
        run: |
          cargo doc --no-deps --workspace
          echo "✅ Documentation built successfully"

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly-2026-05-01
          profile: minimal

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/checkouts/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Memory Safety Scan
        run: |
          cargo clippy --all-targets --all-features --target x86_64-unknown-linux-gnu -- \
            -D warnings -D clippy::integer_arithmetic -D clippy::unwrap_used -D clippy::out_of_bounds

      - name: Unsafe Code Audit
        run: |
          cargo audit

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true